<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111318">
  <title>쉼표부</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skin.css">
</head>
<body>
  <!-- 1920×1080 고정 무대. main.js가 화면 크기에 맞춰 비율을 유지한 채 확대/축소한다. -->
  <div id="viewport">
    <div id="stage" aria-live="polite"></div>
  </div>

  <!-- 흰 그림에 색조를 입히는 필터 (회복 숫자, 지나온 길 점) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="tint-heal" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.150 0.295 0.055 0 0 0.300 0.590 0.110 0 0 0.186 0.366 0.068 0 0 0 0 0 1 0"/></filter><filter id="tint-combo" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.300 0.590 0.110 0 0 0.258 0.507 0.095 0 0 0.135 0.266 0.050 0 0 0 0 0 1 0"/></filter><filter id="tint-hurt" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.300 0.590 0.110 0 0 0.186 0.366 0.068 0 0 0.186 0.366 0.068 0 0 0 0 0 1 0"/></filter><filter id="tint-navy" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.066 0.130 0.024 0 0 0.114 0.224 0.042 0 0 0.198 0.389 0.073 0 0 0 0 0 1 0"/></filter></svg>

  <!-- 아이패드를 세로로 들었을 때 안내 -->
  <div id="rotate-notice">
    <img class="rotate-img" src="assets/ui/ui_rotate_notice.png" alt="">
    <p>기기를 가로로 돌려주세요</p>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/save.js"></script>
  <script src="js/main.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/system.js"></script>
  <script src="js/room.js"></script>
  <script src="js/chapter.js"></script>
  <script src="js/formation.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/result.js"></script>
  <script src="js/character.js"></script>
  <script src="js/counsel.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/preload.js"></script>
  <script>Game.boot();</script>
</body>
</html>
